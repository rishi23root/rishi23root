# Languages SVG via lowlighter/metrics — one quiet strip, daily cadence.
# Requires repo secret METRICS_TOKEN (classic PAT; public_repo is enough for public-only).
# Default GITHUB_TOKEN cannot fetch the user/language data metrics needs.
# After adding the secret: Actions → Metrics → Run workflow.
name: Metrics

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - name: Require METRICS_TOKEN
        id: token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::METRICS_TOKEN is not set. Add it under Settings → Secrets → Actions, then re-run this workflow."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render languages SVG
        if: steps.token.outputs.present == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rishi23root
          filename: assets/languages.svg
          output_action: commit
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: 'Update languages metrics [skip ci]'
          base: ''
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          config_timezone: Asia/Kolkata
