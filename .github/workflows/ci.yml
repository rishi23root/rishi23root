name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Typecheck root and web
        run: npm run check

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:web

      - name: Smoke-check web/dist artifacts
        run: |
          for file in \
            index.html \
            projects/index.html \
            writing/index.html \
            rss.xml \
            llms.txt \
            sitemap-index.xml \
            404.html; do
            path="web/dist/$file"
            if [ ! -s "$path" ]; then
              echo "Missing or empty build artifact: $path" >&2
              exit 1
            fi
          done
          echo "All required web/dist artifacts exist and are non-empty."
